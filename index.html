<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Bài tập Form HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f8;
            color: #333;
        }

        .form-container {
            background-color: #ffffff;
            padding: 20px 25px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }

        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group input[type="date"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .checkbox-group, .radio-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .checkbox-group label, .radio-group label {
            font-weight: normal;
            cursor: pointer;
        }

        .button-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-submit {
            background-color: #2ecc71;
            color: white;
        }

        .btn-submit:hover {
            background-color: #27ae60;
        }

        .btn-reset {
            background-color: #e74c3c;
            color: white;
        }

        .btn-reset:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <!-- PHẦN 1: FORM THÔNG TIN CƠ BẢN & SỞ THÍCH -->
    <div class="form-container">
        <h2>Phần 1: Form Thông Tin Cá Nhân</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="yourname">Họ và tên:</label>
                <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên..." required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Nhập địa chỉ email..." required>
            </div>

            <div class="form-group">
                <label>Sở thích:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="hobby" value="sports"> Thể thao</label>
                    <label><input type="checkbox" name="hobby" value="music"> Âm nhạc</label>
                    <label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>
                    <label><input type="checkbox" name="hobby" value="travel"> Du lịch</label>
                </div>
            </div>

            <div class="button-group">
                <input type="submit" class="btn btn-submit" value="Gửi thông tin">
                <input type="reset" class="btn btn-reset" value="Nhập lại">
            </div>
        </form>
    </div>


    <!-- PHẦN 2: FORM ĐĂNG KÝ HỌC VIÊN -->
    <div class="form-container">
        <h2>Phần 2: Form Đăng Ký Học Viên</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="fullname">Họ và Tên (Full Name):</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required>
            </div>

            <div class="form-group">
                <label for="student_email">Email:</label>
                <input type="email" id="student_email" name="student_email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại (Phone Number):</label>
                <input type="tel" id="phone" name="phone" placeholder="0901234567" required>
            </div>

            <div class="form-group">
                <label for="dob">Ngày sinh (Date of Birth):</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="form-group">
                <label>Giới tính (Gender):</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male" checked> Nam</label>
                    <label><input type="radio" name="gender" value="female"> Nữ</label>
                    <label><input type="radio" name="gender" value="other"> Khác</label>
                </div>
            </div>

            <div class="form-group">
                <label for="course">Khóa học (Course):</label>
                <select id="course" name="course">
                    <option value="html_css">Lập trình HTML & CSS</option>
                    <option value="javascript">Lập trình JavaScript</option>
                    <option value="csharp">Lập trình C#</option>
                    <option value="python">Lập trình Python</option>
                </select>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ (Address):</label>
                <textarea id="address" name="address" rows="3" placeholder="Nhập địa chỉ cư trú..."></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-submit">Đăng ký</button>
                <button type="reset" class="btn btn-reset">Đặt lại</button>
            </div>
        </form>
    </div>

</body>
</html>
